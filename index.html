<style>
:root{--bg:#12201B;--panel:#1A2C26;--line:#2E4740;--ink:#EEEBE2;--mute:#93A69E;--lamp:#F2B441}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.col{display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;flex:none;display:block}
.brand{font:800 20px 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:.04em;white-space:nowrap}
.hero{display:block;width:132px;height:132px;border-radius:28px;align-self:flex-start;box-shadow:0 0 0 1px var(--line)}
@media (max-width:420px){.ondev{display:none}.brand{font-size:17px}}
h1{margin:0;font:800 42px/1.02 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
.muted{color:var(--mute);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--lamp);color:var(--bg);font:700 17px Figtree,sans-serif;text-decoration:none;cursor:pointer;padding:0 20px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--mute);font:600 17px Figtree,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.35}
.stage{position:relative;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000;--split:50%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#gl{clip-path:inset(0 0 0 var(--split))}
.handle{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:var(--lamp);pointer-events:none}
.handle::after{content:"";position:absolute;top:50%;left:-15px;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:var(--lamp)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--lamp)}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--lamp)}
.bar{height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lamp)}
.err{color:#F08A7E;font-size:14px;margin:0}
#file,#vid{position:fixed;left:-9999px;top:0;opacity:0}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const vid=$('vid'), raw=$('raw'), rctx=raw.getContext('2d'), cv=$('gl');
const gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false});
const SW=64, SH=36, small=document.createElement('canvas');
small.width=SW; small.height=SH;
const sctx=small.getContext('2d',{willReadFrequently:true});
const S={prev:null,cum:[0,0],sm:[0,0],corr:[0,0]};
let ready=false, rec=null, chunks=[], outUrl=null, mime='video/webm', target=[3840,2160];
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

if(!window.MediaRecorder||!HTMLVideoElement.prototype.requestVideoFrameCallback)
  $('err').textContent='This browser cannot process video here. Use the latest Chrome, Edge or Safari.';

// ---- GPU upscaler: bilinear sampling + unsharp mask, with stabilization offset and crop zoom
const VS=`attribute vec2 p;varying vec2 v;
void main(){gl_Position=vec4(p,0.,1.);v=vec2(p.x*.5+.5,.5-p.y*.5);}`;
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D t;uniform vec2 px,sh;uniform float k,z;varying vec2 v;
void main(){
vec2 u=(v-.5)/z+.5-sh;
vec3 c=texture2D(t,u).rgb;
vec3 n=texture2D(t,u+vec2(px.x,0.)).rgb+texture2D(t,u-vec2(px.x,0.)).rgb+texture2D(t,u+vec2(0.,px.y)).rgb+texture2D(t,u-vec2(0.,px.y)).rgb;
gl_FragColor=vec4(clamp(c+k*(c-n*.25),0.,1.),1.);
}`;
const mk=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};
const prog=gl.createProgram();
gl.attachShader(prog,mk(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const at=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);
const U={px:gl.getUniformLocation(prog,'px'),sh:gl.getUniformLocation(prog,'sh'),k:gl.getUniformLocation(prog,'k'),z:gl.getUniformLocation(prog,'z')};
gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]
  .forEach(([p,v])=>gl.texParameteri(gl.TEXTURE_2D,p,v));
const maxSize=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0]);
$('r8').disabled=maxSize<7680;

function drawGL(){
  gl.viewport(0,0,cv.width,cv.height);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
  gl.uniform2f(U.px,1/vid.videoWidth,1/vid.videoHeight);
  gl.uniform2f(U.sh,S.corr[0]/SW,S.corr[1]/SH);
  gl.uniform1f(U.k,$('sharp').value/100*.6);
  gl.uniform1f(U.z,$('stab').checked?1.08:1);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

// ---- Light stabilization: translation-only block matching on a tiny grayscale frame,
// causal smoothing (no look-ahead), correction clamped so the crop stays small.
function gray(){
  sctx.drawImage(vid,0,0,SW,SH);
  const d=sctx.getImageData(0,0,SW,SH).data, g=new Float32Array(SW*SH);
  for(let i=0;i<g.length;i++) g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  return g;
}
function stabilize(){
  const c=gray();
  if(S.prev){
    let best=1e15,bx=0,by=0;
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      let s=0;
      for(let y=4;y<SH-4;y+=2)for(let x=4;x<SW-4;x+=2)s+=Math.abs(S.prev[y*SW+x]-c[(y+dy)*SW+x+dx]);
      if(s<best){best=s;bx=dx;by=dy;}
    }
    if(best/392>45){S.cum=[0,0];S.sm=[0,0];}   // scene cut: stop carrying the old path
    else{S.cum[0]+=bx;S.cum[1]+=by;}
  }
  S.prev=c;
  for(let i=0;i<2;i++){
    S.sm[i]+=(S.cum[i]-S.sm[i])*.2;
    S.corr[i]=Math.max(-2.5,Math.min(2.5,S.sm[i]-S.cum[i]));
  }
}

// ---- Preview (idle only)
function render(){
  if(!ready||vid.readyState<2||rec)return;
  S.corr=[0,0];
  rctx.drawImage(vid,0,0,raw.width,raw.height);
  drawGL();
}
function setTarget(eight){
  eight=eight&&maxSize>=7680;
  target=eight?[7680,4320]:[3840,2160];
  $('r8').setAttribute('aria-pressed',String(eight));
  $('r4').setAttribute('aria-pressed',String(!eight));
  cv.width=target[0];cv.height=target[1];
  render();
  warn();
}

function warn(){
  const d=vid.duration||0, eight=target[0]>4000;
  $('err').textContent=eight&&d>180?'8K on a clip longer than 3 minutes can run out of memory. 4K is safer.':d>600?'This clip is longer than 10 minutes. The phone may not have enough memory to save the full export.':'';
}

// Audio for the export. Chrome, Edge and Firefox can tap the video element directly.
// Safari (iPhone and Mac) cannot, so the clip's sound is routed through Web Audio instead.
let actx=null, again=null, adest=null;
function clipAudioTracks(keep){
  if(vid.captureStream)return keep?vid.captureStream().getAudioTracks():[];
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return [];
  if(!actx){
    actx=new AC();
    const src=actx.createMediaElementSource(vid);
    again=actx.createGain();
    adest=actx.createMediaStreamDestination();
    src.connect(again);
    again.connect(adest);
    again.connect(actx.destination);
  }
  again.gain.value=keep?1:0;
  if(actx.state==='suspended')actx.resume();
  return keep?adest.stream.getAudioTracks():[];
}

// ---- Processing: plays the clip once, draws each frame through the GPU path, records the canvas
async function start(){
  if(!ready||rec)return;
  try{
    S.prev=null;S.cum=[0,0];S.sm=[0,0];S.corr=[0,0];
    const tracks=cv.captureStream(30).getVideoTracks();
    const keep=$('audio').checked;
    vid.muted=!keep;
    tracks.push(...clipAudioTracks(keep));
    const type=['video/mp4;codecs=avc1.640033,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const opts={videoBitsPerSecond:target[0]>4000?30e6:15e6};
    if(type)opts.mimeType=type;
    mime=type||'video/webm';
    rec=new MediaRecorder(new MediaStream(tracks),opts);
    chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    rec.onstop=finishSave;
    rec.onerror=e=>{$('err').textContent='Recording failed: '+(e.error?e.error.message:'unknown error');};
    $('save').hidden=true;warn();
    $('status').textContent='Exporting 0%';
    $('go').textContent='Stop and save';
    vid.currentTime=0;
    rec.start(1000);
    await vid.play();
    vid.requestVideoFrameCallback(tick);
  }catch(e){
    $('err').textContent='Could not start: '+e.message;
    const r=rec;rec=null;
    if(r&&r.state!=='inactive')r.stop();
    $('go').textContent='Start upscale';
  }
}
function tick(){
  if(!rec||rec.state!=='recording')return;
  if($('stab').checked)stabilize();else S.corr=[0,0];
  rctx.drawImage(vid,0,0,raw.width,raw.height);
  drawGL();
  const p=vid.duration?vid.currentTime/vid.duration:0;
  $('prog').style.width=(p*100).toFixed(1)+'%';
  $('status').textContent='Exporting '+Math.floor(p*100)+'%';
  $('left').textContent=fmt(vid.duration-vid.currentTime)+' left';
  vid.requestVideoFrameCallback(tick);
}
function stop(){
  if(rec&&rec.state!=='inactive'){vid.pause();rec.stop();}
}
// Some devices record an audio-only file when they cannot encode the frame size (8K on a phone).
// Check the file before offering it, so the user never gets a silent-picture export.
function hasVideo(blob){
  return new Promise(res=>{
    const v=document.createElement('video'), u=URL.createObjectURL(blob);
    let settled=false;
    const done=ok=>{if(settled)return;settled=true;URL.revokeObjectURL(u);v.removeAttribute('src');v.load();res(ok);};
    v.preload='metadata';v.muted=true;
    v.onloadedmetadata=()=>done(v.videoWidth>0&&v.videoHeight>0);
    v.onerror=()=>done(true);          // cannot decode here: trust the recording
    setTimeout(()=>done(true),8000);
    v.src=u;
  });
}
async function finishSave(){
  const parts=chunks;
  chunks=[];rec=null;
  $('go').textContent='Start upscale';
  $('left').textContent='';
  if(!parts.length){
    $('status').textContent='Nothing saved';
    $('prog').style.width='0';
    return;
  }
  $('status').textContent='Checking file';
  const blob=new Blob(parts,{type:mime});
  if(await hasVideo(blob)){
    if(outUrl)URL.revokeObjectURL(outUrl);
    outUrl=URL.createObjectURL(blob);
    const a=$('save');
    a.href=outUrl;
    a.download='clearview-'+target[1]+'p.'+(mime.includes('mp4')?'mp4':'webm');
    a.textContent='Save '+target[1]+'p file';
    a.hidden=false;
    $('status').textContent='Done';
    $('prog').style.width='100%';
  }else{
    $('status').textContent='Failed';
    $('prog').style.width='0';
    $('err').textContent=target[1]+'p could not be encoded on this device, so the file came out without video. Choose 4K and run it again.';
  }
}

// ---- Wiring
$('r4').onclick=()=>{if(!rec)setTarget(false);};
$('r8').onclick=()=>{if(!rec)setTarget(true);};
$('go').onclick=()=>{rec&&rec.state==='recording'?stop():start();};
$('new').onclick=()=>{if(!rec)$('file').click();};
$('file').onchange=e=>{
  const f=e.target.files[0];
  if(!f||rec)return;
  if(outUrl)URL.revokeObjectURL(outUrl);
  outUrl=null;$('save').hidden=true;$('status').textContent='Ready';$('prog').style.width='0';
  vid.src=URL.createObjectURL(f);
};
vid.onloadeddata=()=>{
  ready=true;
  raw.width=1280;raw.height=Math.round(1280*vid.videoHeight/vid.videoWidth);
  $('stage').style.aspectRatio=vid.videoWidth+' / '+vid.videoHeight;
  $('start').hidden=true;$('work').hidden=false;$('new').hidden=false;
  setTarget(target[0]>4000);
};
vid.onseeked=()=>{if(!rec)render();};
vid.onended=stop;
$('scrub').oninput=()=>{if(!rec&&vid.duration)vid.currentTime=vid.duration*$('scrub').value/1000;};
$('split').oninput=e=>$('stage').style.setProperty('--split',e.target.value+'%');
$('sharp').oninput=()=>{if(!rec)render();};
$('stab').onchange=()=>{if(!rec)render();};
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
